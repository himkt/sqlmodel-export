name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.23"
      - name: Build distributions
        run: uv build
      - name: Create an isolated wheel environment
        run: uv venv "$RUNNER_TEMP/wheel-env"
      - name: Install the built wheel
        run: uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl
      - name: Run all tests
        env:
          SQLMODEL_EXPORT_WHEEL_PYTHON: ${{ runner.temp }}/wheel-env/bin/python
        run: uv run --locked --group compatibility pytest tests
